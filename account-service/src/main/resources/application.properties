# Server Configuration
server.port=${PORT:8081}

# Application Name
spring.application.name=account-service

# MongoDB Configuration
# Independent database owned exclusively by the Account Service
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ridelink_account_db}
spring.data.mongodb.database=${MONGODB_DATABASE:ridelink_account_db}
spring.data.mongodb.auto-index-creation=true

# JWT Configuration (Secret key should be minimum 256 bits for HMAC-SHA256)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Springdoc OpenAPI & Swagger UI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.show-actuator=false

# Logging
logging.level.com.ridelink.accountservice=DEBUG
logging.level.org.springframework.security=INFO

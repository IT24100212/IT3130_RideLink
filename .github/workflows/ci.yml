name: RideLink CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-spring-boot-services:
    name: Build and Test All Services
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Account Service
        working-directory: ./account-service
        run: mvn clean test

      - name: Build Ride Management Service
        working-directory: ./ride-management-service
        run: mvn clean test

      - name: Build Driver & Vehicle Service
        working-directory: ./driver-vehicle-service
        run: mvn clean test

      - name: Build Fare & Payment Service
        working-directory: ./fare-payment-service
        run: mvn clean test